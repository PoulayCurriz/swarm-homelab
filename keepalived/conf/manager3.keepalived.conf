global_defs {
    script_user nobody
    enable_script_security
    max_auto_priority 99
}

vrrp_script chk_avail {
    script "/etc/keepalived/healthcheck.sh"
    interval 1
    weight 10
    rise 6
    fall 1
}

vrrp_instance manager3.home.arpa {
    interface eth0

    state BACKUP
    virtual_router_id 50
    # Failover order: manager1 > manager2 > manager3. The spread between nodes must stay
    # below the chk_avail weight, or a failed master keeps the VIP.
    priority 100
    advert_int 1

    unicast_src_ip 192.168.X.X
    unicast_peer {
        192.168.X.X
        192.168.X.X
    }

    # Traefik VIP, also set in pihole/conf/02-wildcard-homelab.conf
    virtual_ipaddress {
        192.168.X.X dev eth0
    }

    track_script {
        chk_avail
    }
}