---
- name: Install Python3 pip
  tags:
    - requirements
  become: true
  ansible.builtin.dnf:
    name:
      - python3-pip
    update_cache: true
    use_backend: dnf4

- name: Install Python 3 lib
  tags:
    - requirements
  become: true
  ansible.builtin.pip:
    name: "{{ item.name }}"
    version: "{{ item.version }}"
    executable: /usr/bin/pip3.12
    state: present
  with_items:
    - { name: jsondiff, version: '2.2.1' }
