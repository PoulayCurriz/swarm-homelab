---
- name: Set redhat family distribution
  tags:
    - requirements
  ansible.builtin.set_fact:
    redhat_family_distribution: >-
      {{
        'rhel' if ('Red Hat' in ansible_facts.distribution)
        else ('centos' if ('CentOS' in ansible_facts.distribution or 'Rocky' in ansible_facts.distribution)
        else ('fedora' if ('Fedora' in ansible_facts.distribution)
        else ansible_facts.distribution | lower))
      }}
  when: ansible_facts.os_family == "RedHat"

- name: RockyLinux install requirements
  tags:
    - requirements
  ansible.builtin.include_tasks: rockylinux.yml
  when: ansible_facts.distribution == 'Rocky' or ansible_facts.distribution == 'Fedora'

- name: Debian install requirements
  tags:
    - requirements
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts.distribution == 'Debian'
