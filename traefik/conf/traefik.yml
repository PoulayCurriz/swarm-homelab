---
providers:
  swarm:
    endpoint: "tcp://socket_proxy:2375"
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic_conf

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs:
        - "10.0.0.0/8"
        - "192.168.0.0/16"
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs:
        - "10.0.0.0/8"
        - "192.168.0.0/16"

api:
  dashboard: true

serversTransport:
  rootCAs:
    - /certs/homelab.crt

ping: {}

log:
  level: debug
