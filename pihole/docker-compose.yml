---
services:
  nginx_middleware:
    image: ghcr.io/nginxinc/nginx-unprivileged:stable-alpine
    deploy:
      placement:
        constraints:
          - node.labels.schedulable == true
      resources:
        reservations:
          cpus: '0.10'
          memory: 64M
        limits:
          cpus: '0.50'
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=homelab"
        - "traefik.http.routers.pihole-http.entrypoints=web"
        - "traefik.http.routers.pihole-http.rule=Host(`hole.home.arpa`)"
        - "traefik.http.routers.pihole-http.middlewares=pihole-https"
        - "traefik.http.middlewares.pihole-https.redirectscheme.scheme=https"
        - "traefik.http.routers.pihole.rule=Host(`hole.home.arpa`)"
        - "traefik.http.routers.pihole.entrypoints=websecure"
        - "traefik.http.services.pihole.loadbalancer.server.port=8080"
        - "traefik.http.routers.pihole.service=pihole"
        - "traefik.http.routers.pihole.tls=true"
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    volumes:
      - nginx_logs:/var/log/nginx
    logging:
      driver: "json-file"
      options:
        labels-regex: "^.+"
        max-size: "200k"
        max-file: "10"
    networks:
      - homelab
      - internal
    healthcheck:
      test: ["CMD", "curl", "-sSL", "localhost:8080"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s

  pihole:
    image: ghcr.io/pi-hole/pihole:2026.10.1
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == manager1.home.arpa
          - node.labels.schedulable == true
      resources:
        reservations:
          cpus: '0.10'
          memory: 64M
        limits:
          cpus: '0.50'
          memory: 128M
    cap_add:
      - CHOWN
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - SYS_NICE
      - SYS_TIME
    networks:
      - internal
      - external
    ports:
      - target: 53
        published: 53
        protocol: tcp
      - target: 53
        published: 53
        protocol: udp
    environment:
      TZ: 'Europe/Paris'
    logging:
      driver: "json-file"
      options:
        labels-regex: "^.+"
        max-size: "200k"
        max-file: "10"
  # configs:
  #   - source: pihole-wildcard-homelab-config
  #     target: /etc/dnsmasq.d/02-wildcard-homelab.conf
    volumes:
      - 'pihole-data:/etc/pihole'
      - 'pihole-dnsmasq:/etc/dnsmasq.d'

configs:
  pihole-wildcard-homelab-config:
    file: ./conf/02-wildcard-homelab.conf
  nginx_config:
    file: ./conf/hole-nginx.conf


volumes:
  pihole-data:
  pihole-dnsmasq:
  nginx_logs:

networks:
  external:
    driver: overlay
  internal:
    driver: overlay
    internal: true
  homelab:
    external: true
