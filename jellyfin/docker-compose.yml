---
networks:
  homelab:
    external: true
  internal:

volumes:
  config:
  cache:

secrets:
  jellyfin_newt_config:
    external: true

services:
  server:
    image: ghcr.io/jellyfin/jellyfin:12.0
    volumes:
      - /opt/data/torrent:/media
      - config:/config
      - cache:/cache
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin-old.home.arpa
    deploy:
      replicas: 1
      mode: replicated
      placement:
        constraints:
          - node.hostname == worker.home.arpa
          - node.labels.schedulable == true
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=homelab"
        - "traefik.http.routers.jellyfin.rule=Host(`jellyfin-old.home.arpa`)"
        - "traefik.http.routers.jellyfin.entrypoints=websecure"
        - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
        - "traefik.http.routers.jellyfin.service=jellyfin"
        - "traefik.http.routers.jellyfin.tls=true"
        - "traefik.http.routers.jellyfin-local.rule=Host(`jellyfin-old.home.arpa`)"
        - "traefik.http.routers.jellyfin-local.entrypoints=web"
        - "traefik.http.services.jellyfin-local.loadbalancer.server.port=8096"
        - "traefik.http.routers.jellyfin-local.service=jellyfin"
        - "traefik.http.middlewares.allow-local-only.ipwhitelist.sourcerange=192.168.0.0/16,10.0.0.0/8"
        - "traefik.http.middlewares.allow-local-only.ipwhitelist.ipstrategy.depth=0"
        - "traefik.http.routers.jellyfin-local.middlewares=allow-local-only"
    networks:
      - homelab
      - internal


  newt:
    image: ghcr.io/fosrl/newt:1.11
    environment:
      CONFIG_FILE: /run/secrets/jellyfin_newt_config
    secrets:
      - jellyfin_newt_config
    networks:
      - internal
